<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    
    <!-- Sidebar Background -->
    <linearGradient id="sidebarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151b28" />
      <stop offset="100%" stop-color="#0f141f" />
    </linearGradient>

    <!-- Running Pulse Animation -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .label-primary { font-size: 12px; font-weight: 500; fill: #e2e8f0; }
    .label-secondary { font-size: 11px; fill: #94a3b8; }
    .label-tertiary { font-size: 10px; fill: #64748b; }
    .tag { font-size: 10px; font-weight: 600; }
  </style>

  <!-- Canvas Background -->
  <rect width="880" height="580" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1" />

  <!-- App Window Header Bar -->
  <rect width="880" height="38" rx="12" fill="#0f172a" />
  <circle cx="20" cy="19" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="38" cy="19" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="56" cy="19" r="6" fill="#10b981" opacity="0.8" />
  <text x="440" y="23" text-anchor="middle" class="font-base" font-size="12" fill="#64748b" font-weight="500">DeepSeek Harness — dsh-workspace-tree 侧边栏交互演示</text>

  <!-- Left Sidebar Panel (Takeover Area) -->
  <g transform="translate(16, 48)">
    <rect width="280" height="516" rx="8" fill="url(#sidebarGrad)" stroke="#1e293b" stroke-width="1" />

    <!-- 1. Header: 工作区 -->
    <text x="14" y="24" class="font-base title">工作区</text>
    <!-- Search Icon Button -->
    <g transform="translate(252, 12)">
      <circle cx="7" cy="7" r="7" fill="rgba(255,255,255,0.06)" />
      <path d="M5 5a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0zm4.5 4.5L12 12" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- 2. Active Task Banner 1: 进行中 (Running) -->
    <g transform="translate(8, 36)">
      <rect width="264" height="28" rx="6" fill="rgba(96, 165, 250, 0.1)" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1"/>
      <circle cx="14" cy="14" r="5" fill="#60a5fa" opacity="0.3"/>
      <circle cx="14" cy="14" r="3" fill="#60a5fa" filter="url(#blueGlow)"/>
      <text x="26" y="18" class="font-base" font-size="12" font-weight="500" fill="#f8fafc">genui插件 实时渲染调试</text>
      <!-- Tag -->
      <rect x="214" y="6" width="42" height="16" rx="4" fill="rgba(96, 165, 250, 0.2)"/>
      <text x="235" y="18" text-anchor="middle" class="font-base tag" fill="#60a5fa">进行中</text>
    </g>

    <!-- 2. Active Task Banner 2: 已完成待读 (Completed / Unread) -->
    <g transform="translate(8, 68)">
      <rect width="264" height="28" rx="6" fill="rgba(74, 222, 128, 0.08)" stroke="rgba(74, 222, 128, 0.3)" stroke-width="1"/>
      <circle cx="14" cy="14" r="5" fill="#4ade80" opacity="0.3"/>
      <circle cx="14" cy="14" r="3" fill="#4ade80" filter="url(#greenGlow)"/>
      <text x="26" y="18" class="font-base" font-size="12" font-weight="500" fill="#f8fafc">Oracle 字段映射分析</text>
      <!-- Tag -->
      <rect x="222" y="6" width="34" height="16" rx="4" fill="rgba(74, 222, 128, 0.2)"/>
      <text x="239" y="18" text-anchor="middle" class="font-base tag" fill="#4ade80">待读</text>
    </g>

    <!-- 3. Workspace Row: dsh相关 (Expanded) -->
    <g transform="translate(8, 104)">
      <rect width="264" height="30" rx="6" fill="rgba(255,255,255,0.06)"/>
      <path d="M8 12 L13 17 L18 12" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Folder Icon -->
      <path d="M24 10 L30 10 L32 12 L42 12 C43 12 44 13 44 14 L44 22 C44 23 43 24 42 24 L24 24 C23 24 22 23 22 22 L22 12 C22 11 23 10 24 10 Z" fill="#60a5fa" opacity="0.9"/>
      <text x="48" y="20" class="font-base" font-size="13" font-weight="600" fill="#f8fafc">dsh相关</text>
      <!-- Actions on hover -->
      <text x="246" y="20" class="font-base" font-size="14" fill="#94a3b8">⋯</text>
    </g>

    <!-- 4. Virtual Folder 1: 📁 数据库分析工具 (3) -->
    <g transform="translate(16, 138)">
      <rect width="256" height="28" rx="6" fill="rgba(255,255,255,0.02)"/>
      <path d="M6 11 L10 15 L14 11" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
      <path d="M18 9 L22 9 L24 11 L31 11 C32 11 33 12 33 13 L33 19 C33 20 32 21 31 21 L18 21 C17 21 16 20 16 19 L16 11 C16 10 17 9 18 9 Z" fill="#38bdf8"/>
      <text x="38" y="19" class="font-base label-primary">数据库分析工具</text>
      <text x="132" y="19" class="font-base label-tertiary">(3)</text>
      <!-- Quick [+] Button -->
      <g transform="translate(236, 6)">
        <rect width="16" height="16" rx="3" fill="rgba(255,255,255,0.06)" />
        <path d="M8 4 L8 12 M4 8 L12 8" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Folder 1 Child Sessions -->
    <g transform="translate(32, 168)">
      <!-- Session 1.1 -->
      <rect width="240" height="26" rx="4" fill="rgba(96,165,250,0.08)"/>
      <path d="M6 8 C6 6.5 7.5 5 9 5 L17 5 C18.5 5 20 6.5 20 8 L20 13 C20 14.5 18.5 16 17 16 L10 16 L6 19 Z" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
      <text x="26" y="17" class="font-base" font-size="12" font-weight="600" fill="#93c5fd">HTFS 土壤墒情监测</text>
      <text x="206" y="17" class="font-base label-secondary">刚刚</text>
    </g>
    <g transform="translate(32, 196)">
      <!-- Session 1.2 -->
      <rect width="240" height="26" rx="4" fill="transparent"/>
      <path d="M6 8 C6 6.5 7.5 5 9 5 L17 5 C18.5 5 20 6.5 20 8 L20 13 C20 14.5 18.5 16 17 16 L10 16 L6 19 Z" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <text x="26" y="17" class="font-base label-primary">MySQL 慢查询治理方案</text>
      <text x="204" y="17" class="font-base label-tertiary">3小时</text>
    </g>

    <!-- 5. Virtual Folder 2: 📁 插件开发组 (2) -->
    <g transform="translate(16, 226)">
      <rect width="256" height="28" rx="6" fill="transparent"/>
      <path d="M6 11 L10 15 L14 11" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
      <path d="M18 9 L22 9 L24 11 L31 11 C32 11 33 12 33 13 L33 19 C33 20 32 21 31 21 L18 21 C17 21 16 20 16 19 L16 11 C16 10 17 9 18 9 Z" fill="#4ade80"/>
      <text x="38" y="19" class="font-base label-primary">插件架构重构</text>
      <text x="120" y="19" class="font-base label-tertiary">(2)</text>
      <!-- Quick [+] Button -->
      <g transform="translate(236, 6)">
        <rect width="16" height="16" rx="3" fill="rgba(255,255,255,0.06)" />
        <path d="M8 4 L8 12 M4 8 L12 8" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Folder 2 Child Sessions -->
    <g transform="translate(32, 256)">
      <!-- Session 2.1 (Pinned) -->
      <rect width="240" height="26" rx="4" fill="transparent"/>
      <!-- Pin Icon -->
      <path d="M12 4 L14 8 L16 9 L13 12 L14 16 L12 14 L10 16 L11 12 L8 9 L10 8 Z" fill="#fbbf24" stroke="#fbbf24" stroke-width="0.5"/>
      <text x="26" y="17" class="font-base label-primary">dsh-workspace-tree 开发</text>
      <text x="206" y="17" class="font-base label-tertiary">置顶</text>
    </g>

    <!-- 6. Uncategorized Sessions Section -->
    <g transform="translate(16, 290)">
      <!-- Uncategorized Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="256" height="26" rx="4" fill="transparent"/>
        <path d="M6 8 C6 6.5 7.5 5 9 5 L17 5 C18.5 5 20 6.5 20 8 L20 13 C20 14.5 18.5 16 17 16 L10 16 L6 19 Z" fill="none" stroke="#64748b" stroke-width="1.2"/>
        <text x="26" y="17" class="font-base label-primary">TDAI 分层记忆中枢联调</text>
        <text x="220" y="17" class="font-base label-tertiary">昨天</text>
      </g>
      <!-- Uncategorized Item 2 -->
      <g transform="translate(0, 28)">
        <rect width="256" height="26" rx="4" fill="transparent"/>
        <path d="M6 8 C6 6.5 7.5 5 9 5 L17 5 C18.5 5 20 6.5 20 8 L20 13 C20 14.5 18.5 16 17 16 L10 16 L6 19 Z" fill="none" stroke="#64748b" stroke-width="1.2"/>
        <text x="26" y="17" class="font-base label-primary">Tauri 桌面端缩放支持</text>
        <text x="216" y="17" class="font-base label-tertiary">2天前</text>
      </g>
      <!-- Show More Expander -->
      <g transform="translate(0, 58)">
        <rect width="256" height="24" rx="4" fill="rgba(255,255,255,0.02)"/>
        <text x="128" y="16" text-anchor="middle" class="font-base" font-size="11" fill="#94a3b8">展开其余 12 个会话 ▾</text>
      </g>
    </g>
  </g>

  <!-- Right Feature Highlights Callouts -->
  <g transform="translate(316, 60)">
    <!-- Feature 1: Folder Scoped New Session -->
    <g transform="translate(0, 0)">
      <rect width="530" height="92" rx="8" fill="#161f30" stroke="#2563eb" stroke-width="1.2" />
      <circle cx="28" cy="28" r="14" fill="rgba(37,99,235,0.2)" />
      <text x="28" y="33" text-anchor="middle" font-size="14" fill="#60a5fa">➕</text>
      <text x="54" y="26" class="font-base" font-size="14" font-weight="600" fill="#f8fafc">文件夹一键直建会话 (Folder-Scoped New Session)</text>
      <text x="54" y="48" class="font-base" font-size="12" fill="#94a3b8">悬停任意文件夹点击 [+] 即可在该文件夹下精准开启新会话，</text>
      <text x="54" y="68" class="font-base" font-size="12" fill="#60a5fa">零异步时序竞态，原子直属归入，老会话位置绝对不被串扰！</text>
    </g>

    <!-- Feature 2: Active & Unread Banner Flow -->
    <g transform="translate(0, 108)">
      <rect width="530" height="92" rx="8" fill="#12251e" stroke="#059669" stroke-width="1.2" />
      <circle cx="28" cy="28" r="14" fill="rgba(16,185,129,0.2)" />
      <text x="28" y="33" text-anchor="middle" font-size="14" fill="#34d399">🚀</text>
      <text x="54" y="26" class="font-base" font-size="14" font-weight="600" fill="#f8fafc">顶部 28px 任务胶囊与待读流转 (Task Banner &amp; Read-to-Dismiss)</text>
      <text x="54" y="48" class="font-base" font-size="12" fill="#94a3b8">执行中呈蓝光呼吸脉冲，后台完成后转为常驻绿光 [待读] 态，</text>
      <text x="54" y="68" class="font-base" font-size="12" fill="#4ade80">点击胶囊一键展开对应工作区与文件夹直达，阅读完毕自动优雅消除。</text>
    </g>

    <!-- Feature 3: Smooth Drag & Drop -->
    <g transform="translate(0, 216)">
      <rect width="530" height="92" rx="8" fill="#251a30" stroke="#9333ea" stroke-width="1.2" />
      <circle cx="28" cy="28" r="14" fill="rgba(168,85,247,0.2)" />
      <text x="28" y="33" text-anchor="middle" font-size="14" fill="#c084fc">🖐️</text>
      <text x="54" y="26" class="font-base" font-size="14" font-weight="600" fill="#f8fafc">纯净抓手拖拽与高亮指示 (Smooth Drag &amp; Drop)</text>
      <text x="54" y="48" class="font-base" font-size="12" fill="#94a3b8">全链路拦截文字误选（user-select: none），拖拽时文件夹虚线蓝光高亮，</text>
      <text x="54" y="68" class="font-base" font-size="12" fill="#c084fc">未分类区提供专属释放槽，支持跨分类、移出未分类毫秒级瞬时响应！</text>
    </g>

    <!-- Feature 4: 0ms Reactive Engine & Local First -->
    <g transform="translate(0, 324)">
      <rect width="530" height="92" rx="8" fill="#1e2430" stroke="#475569" stroke-width="1.2" />
      <circle cx="28" cy="28" r="14" fill="rgba(148,163,184,0.2)" />
      <text x="28" y="33" text-anchor="middle" font-size="14" fill="#cbd5e1">⚡</text>
      <text x="54" y="26" class="font-base" font-size="14" font-weight="600" fill="#f8fafc">0ms 响应式快照与多工作区常驻 (0ms Reactive TreeStore)</text>
      <text x="54" y="48" class="font-base" font-size="12" fill="#94a3b8">基于版本递增快照驱动 React 重渲染，彻底根除 5 秒卡顿延迟；</text>
      <text x="54" y="68" class="font-base" font-size="12" fill="#94a3b8">各工作区元数据独立持久化在 .dsh/workspace-tree.json，切换稳定常驻。</text>
    </g>
  </g>
</svg>
