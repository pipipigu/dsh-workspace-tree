<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="sidebarGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151b28" />
      <stop offset="100%" stop-color="#0f141f" />
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60a5fa" />
    </marker>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .label-primary { font-size: 12px; font-weight: 500; fill: #e2e8f0; }
    .label-tertiary { font-size: 10px; fill: #64748b; }
  </style>

  <!-- Canvas Background -->
  <rect width="880" height="440" rx="12" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="1" />

  <!-- App Header -->
  <rect width="880" height="36" rx="12" fill="#0f172a" />
  <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="52" cy="18" r="5" fill="#10b981" opacity="0.8" />
  <text x="440" y="23" text-anchor="middle" class="font-base" font-size="12" fill="#64748b" font-weight="500">dsh-workspace-tree — 点击式精准移动与快捷归类演示</text>

  <!-- Left Sidebar Panel -->
  <g transform="translate(24, 48)">
    <rect width="320" height="368" rx="8" fill="url(#sidebarGrad2)" stroke="#1e293b" stroke-width="1" />

    <!-- 1. Header -->
    <text x="14" y="24" class="font-base title">工作区 / project-workspace</text>

    <!-- 2. Target Folder 1 -->
    <g transform="translate(12, 42)">
      <rect width="296" height="30" rx="6" fill="rgba(255, 255, 255, 0.02)"/>
      <path d="M10 12 L14 16 L18 12" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
      <path d="M22 10 L26 10 L28 12 L35 12 C36 12 37 13 37 14 L37 20 C37 21 36 22 35 22 L22 22 C21 22 20 21 20 20 L20 12 C20 11 21 10 22 10 Z" fill="#38bdf8"/>
      <text x="42" y="20" class="font-base label-primary">核心后端模块</text>
      <text x="120" y="20" class="font-base label-tertiary">(2)</text>
      <!-- Quick [+] Button -->
      <g transform="translate(266, 6)">
        <rect width="18" height="18" rx="3" fill="rgba(255,255,255,0.08)" />
        <path d="M9 5 L9 13 M5 9 L13 9" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Folder 1 Child Session (With Move Out Button) -->
    <g transform="translate(28, 78)">
      <rect width="280" height="26" rx="4" fill="transparent"/>
      <path d="M6 8 C6 6.5 7.5 5 9 5 L17 5 C18.5 5 20 6.5 20 8 L20 13 C20 14.5 18.5 16 17 16 L10 16 L6 19 Z" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <text x="26" y="17" class="font-base label-primary">架构设计与接口规范</text>
      <!-- Action: Move Out -->
      <g transform="translate(250, 4)">
        <rect width="18" height="18" rx="3" fill="rgba(255,255,255,0.06)"/>
        <path d="M4 9 L10 9 M7 6 L10 9 L7 12" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
      </g>
    </g>

    <!-- 3. Target Folder 2 -->
    <g transform="translate(12, 110)">
      <rect width="296" height="30" rx="6" fill="transparent"/>
      <path d="M10 12 L14 16 L18 12" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
      <path d="M22 10 L26 10 L28 12 L35 12 C36 12 37 13 37 14 L37 20 C37 21 36 22 35 22 L22 22 C21 22 20 21 20 20 L20 12 C20 11 21 10 22 10 Z" fill="#4ade80"/>
      <text x="42" y="20" class="font-base label-primary">前端组件库</text>
      <text x="108" y="20" class="font-base label-tertiary">(1)</text>
      <!-- Quick [+] Button -->
      <g transform="translate(266, 6)">
        <rect width="18" height="18" rx="3" fill="rgba(255,255,255,0.08)" />
        <path d="M9 5 L9 13 M5 9 L13 9" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 4. Uncategorized Item with Move Dropdown Active -->
    <g transform="translate(12, 148)">
      <rect width="296" height="30" rx="6" fill="rgba(255,255,255,0.06)"/>
      <path d="M12 9 C12 7.5 13.5 6 15 6 L23 6 C24.5 6 26 7.5 26 9 L26 14 C26 15.5 24.5 17 23 17 L16 17 L12 20 Z" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
      <text x="32" y="19" class="font-base" font-size="12" font-weight="600" fill="#93c5fd">全链路监控接入与日志采集</text>

      <!-- Hover Action Buttons -->
      <g transform="translate(210, 5)">
        <!-- Pin -->
        <path d="M5 2 L6 5 L8 6 L6 8 L6 11 L5 9 L4 11 L4 8 L2 6 L4 5 Z" fill="#fbbf24"/>
        <!-- Edit -->
        <path d="M15 4 L18 7 L12 13 L9 13 L9 10 Z" fill="none" stroke="#94a3b8" stroke-width="1"/>
        <!-- Move Icon (Active) -->
        <g transform="translate(24, 0)">
          <rect width="20" height="20" rx="4" fill="rgba(96,165,250,0.25)"/>
          <path d="M4 6 L7 6 L8 8 L14 8 C14.5 8 15 8.5 15 9 L15 13 C15 13.5 14.5 14 14 14 L4 14 C3.5 14 3 13.5 3 13 L3 7 C3 6.5 3.5 6 4 6 Z" fill="#60a5fa"/>
        </g>
      </g>

      <!-- Move Popover Dropdown Panel -->
      <g transform="translate(110, 32)">
        <rect width="180" height="110" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" filter="drop-shadow(0 8px 18px rgba(0,0,0,0.6))"/>
        <text x="12" y="18" class="font-base" font-size="11" fill="#64748b" font-weight="600">移动至目标文件夹...</text>
        
        <!-- Dropdown Option 1 -->
        <g transform="translate(8, 26)">
          <rect width="164" height="24" rx="4" fill="rgba(96,165,250,0.14)"/>
          <path d="M6 7 L8 7 L9 8 L14 8 C14.5 8 15 8.5 15 9 L15 13 C15 13.5 14.5 14 14 14 L6 14 C5.5 14 5 13.5 5 13 L5 8 C5 7.5 5.5 7 6 7 Z" fill="#38bdf8"/>
          <text x="22" y="16" class="font-base" font-size="11" fill="#93c5fd" font-weight="500">📁 核心后端模块</text>
        </g>

        <!-- Dropdown Option 2 -->
        <g transform="translate(8, 52)">
          <rect width="164" height="24" rx="4" fill="transparent"/>
          <path d="M6 7 L8 7 L9 8 L14 8 C14.5 8 15 8.5 15 9 L15 13 C15 13.5 14.5 14 14 14 L6 14 C5.5 14 5 13.5 5 13 L5 8 C5 7.5 5.5 7 6 7 Z" fill="#4ade80"/>
          <text x="22" y="16" class="font-base" font-size="11" fill="#cbd5e1">📁 前端组件库</text>
        </g>

        <!-- Dropdown Option 3: New Folder Action -->
        <g transform="translate(8, 80)">
          <line x1="0" y1="0" x2="164" y2="0" stroke="#334155" stroke-width="0.8"/>
          <text x="22" y="16" class="font-base" font-size="11" fill="#60a5fa" font-weight="500">+ 新建文件夹并移入</text>
        </g>
      </g>
    </g>

    <!-- Other Item -->
    <g transform="translate(12, 298)">
      <rect width="296" height="28" rx="6" fill="transparent"/>
      <path d="M12 9 C12 7.5 13.5 6 15 6 L23 6 C24.5 6 26 7.5 26 9 L26 14 C26 15.5 24.5 17 23 17 L16 17 L12 20 Z" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <text x="32" y="18" class="font-base label-primary">Tauri 桌面端缩放支持</text>
    </g>
  </g>

  <!-- Right Explanations -->
  <g transform="translate(370, 60)">
    <!-- Point 1 -->
    <g transform="translate(0, 0)">
      <rect width="480" height="96" rx="8" fill="#161f30" stroke="#2563eb" stroke-width="1.2"/>
      <text x="20" y="30" class="font-base" font-size="14" font-weight="600" fill="#93c5fd">1. 点击式精准移动菜单 (Precision Move Dropdown)</text>
      <text x="20" y="56" class="font-base" font-size="12" fill="#cbd5e1">悬停会话行点击「📁 移动」图标，即刻弹出文件夹选择面板，</text>
      <text x="20" y="78" class="font-base" font-size="12" fill="#94a3b8">一键点击目标分类直接归入，杜绝拖拽误选文字或手抖放错位置！</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(0, 112)">
      <rect width="480" height="96" rx="8" fill="#12251e" stroke="#059669" stroke-width="1.2"/>
      <text x="20" y="30" class="font-base" font-size="14" font-weight="600" fill="#86efac">2. 文件夹行内一键直建会话 (Folder-Scoped New Session)</text>
      <text x="20" y="56" class="font-base" font-size="12" fill="#cbd5e1">悬停在任意文件夹行点击右侧 [+] 按钮，自动在该文件夹下创建新会话，</text>
      <text x="20" y="78" class="font-base" font-size="12" fill="#4ade80">精准绑定 SessionId，新会话稳稳出生在文件夹内，无需后续手动整理。</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(0, 224)">
      <rect width="480" height="96" rx="8" fill="#251a30" stroke="#9333ea" stroke-width="1.2"/>
      <text x="20" y="30" class="font-base" font-size="14" font-weight="600" fill="#d8b4fe">3. 一键移出与双击重命名 (Quick Eject &amp; Inline Rename)</text>
      <text x="20" y="56" class="font-base" font-size="12" fill="#cbd5e1">文件夹内的会话悬停即可点击「移出」图标瞬时退回未分类；</text>
      <text x="20" y="78" class="font-base" font-size="12" fill="#c084fc">双击任意文件夹或会话名称直接原地编辑，按 Esc 安全退出。</text>
    </g>
  </g>
</svg>
