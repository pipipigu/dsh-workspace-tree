<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="sidebarGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151b28" />
      <stop offset="100%" stop-color="#0f141f" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60a5fa" />
    </marker>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .label-primary { font-size: 12px; font-weight: 500; fill: #e2e8f0; }
    .label-tertiary { font-size: 10px; fill: #64748b; }
  </style>

  <!-- Canvas Background -->
  <rect width="880" height="440" rx="12" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="1" />

  <!-- App Header -->
  <rect width="880" height="36" rx="12" fill="#0f172a" />
  <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="52" cy="18" r="5" fill="#10b981" opacity="0.8" />
  <text x="440" y="23" text-anchor="middle" class="font-base" font-size="12" fill="#64748b" font-weight="500">dsh-workspace-tree — 拖拽交互与高亮释放示意</text>

  <!-- Left Sidebar Panel (Drag State) -->
  <g transform="translate(24, 48)">
    <rect width="320" height="368" rx="8" fill="url(#sidebarGrad2)" stroke="#1e293b" stroke-width="1" />

    <!-- 1. Header -->
    <text x="14" y="24" class="font-base title">工作区 / dsh相关</text>

    <!-- 2. Target Folder: Hovered Drag Target -->
    <g transform="translate(12, 42)">
      <!-- Highlighted Folder Row -->
      <rect width="296" height="32" rx="6" fill="rgba(96, 165, 250, 0.18)" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="4 3"/>
      <path d="M10 13 L14 17 L18 13" stroke="#60a5fa" stroke-width="1.5" fill="none"/>
      <path d="M22 11 L26 11 L28 13 L35 13 C36 13 37 14 37 15 L37 21 C37 22 36 23 35 23 L22 23 C21 23 20 22 20 21 L20 13 C20 12 21 11 22 11 Z" fill="#60a5fa"/>
      <text x="42" y="21" class="font-base" font-size="12" font-weight="600" fill="#93c5fd">数据库分析工具</text>
      <text x="140" y="21" class="font-base label-tertiary">(2)</text>
      <!-- Prompt Badge -->
      <rect x="200" y="7" width="88" height="18" rx="4" fill="rgba(96,165,250,0.3)"/>
      <text x="244" y="20" text-anchor="middle" class="font-base" font-size="10" font-weight="600" fill="#93c5fd">松开移入此处</text>
    </g>

    <!-- Folder Child Session -->
    <g transform="translate(32, 82)">
      <rect width="276" height="26" rx="4" fill="transparent"/>
      <path d="M6 8 C6 6.5 7.5 5 9 5 L17 5 C18.5 5 20 6.5 20 8 L20 13 C20 14.5 18.5 16 17 16 L10 16 L6 19 Z" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <text x="26" y="17" class="font-base label-primary">HTFS 土壤墒情监测</text>
    </g>

    <!-- 3. Uncategorized Drop Zone (Active while dragging) -->
    <g transform="translate(12, 120)">
      <rect width="296" height="32" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" stroke-dasharray="4 3"/>
      <!-- Move Out Icon -->
      <g transform="translate(68, 10)">
        <path d="M2 7 L10 7 M6 3 L10 7 L6 11" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
      </g>
      <text x="156" y="21" text-anchor="middle" class="font-base" font-size="11" fill="#94a3b8">拖放到此处 移出会话至未分类</text>
    </g>

    <!-- 4. Being Dragged Session (Ghost state) -->
    <g transform="translate(12, 162)">
      <rect width="296" height="30" rx="6" fill="rgba(255,255,255,0.02)" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
      <path d="M12 9 C12 7.5 13.5 6 15 6 L23 6 C24.5 6 26 7.5 26 9 L26 14 C26 15.5 24.5 17 23 17 L16 17 L12 20 Z" fill="none" stroke="#60a5fa" stroke-width="1.2" opacity="0.4"/>
      <text x="32" y="19" class="font-base" font-size="12" fill="#60a5fa" opacity="0.4">MySQL 慢查询治理方案</text>
    </g>

    <!-- Other Sessions -->
    <g transform="translate(12, 198)">
      <rect width="296" height="28" rx="6" fill="transparent"/>
      <path d="M12 9 C12 7.5 13.5 6 15 6 L23 6 C24.5 6 26 7.5 26 9 L26 14 C26 15.5 24.5 17 23 17 L16 17 L12 20 Z" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <text x="32" y="18" class="font-base label-primary">TDAI 分层记忆中枢联调</text>
    </g>
    <g transform="translate(12, 230)">
      <rect width="296" height="28" rx="6" fill="transparent"/>
      <path d="M12 9 C12 7.5 13.5 6 15 6 L23 6 C24.5 6 26 7.5 26 9 L26 14 C26 15.5 24.5 17 23 17 L16 17 L12 20 Z" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <text x="32" y="18" class="font-base label-primary">Tauri 桌面端缩放支持</text>
    </g>
  </g>

  <!-- Dragging Floating Cursor Card -->
  <g transform="translate(160, 150)">
    <rect width="220" height="32" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.6))"/>
    <path d="M12 10 C12 8.5 13.5 7 15 7 L23 7 C24.5 7 26 8.5 26 10 L26 15 C26 16.5 24.5 18 23 18 L16 18 L12 21 Z" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="32" y="20" class="font-base" font-size="12" font-weight="600" fill="#f8fafc">MySQL 慢查询治理方案</text>
    <!-- Drag Trajectory Arrow -->
    <path d="M -10 40 Q -30 -10 -4 -40" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Right Explanations -->
  <g transform="translate(370, 60)">
    <!-- Point 1 -->
    <g transform="translate(0, 0)">
      <rect width="480" height="96" rx="8" fill="#161f30" stroke="#2563eb" stroke-width="1.2"/>
      <text x="20" y="30" class="font-base" font-size="14" font-weight="600" fill="#93c5fd">1. 鼠标按下与文字防误选 (Text Selection Guard)</text>
      <text x="20" y="56" class="font-base" font-size="12" fill="#cbd5e1">在会话行与内部标题严格注入 <tspan fill="#60a5fa">user-select: none</tspan>，鼠标按下拖拽时</text>
      <text x="20" y="78" class="font-base" font-size="12" fill="#94a3b8">绝不触发浏览器划词选中，100% 顺畅识别为整卡拖动。</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(0, 112)">
      <rect width="480" height="96" rx="8" fill="#12251e" stroke="#059669" stroke-width="1.2"/>
      <text x="20" y="30" class="font-base" font-size="14" font-weight="600" fill="#86efac">2. 文件夹落点高亮反馈 (Visual Drop Target)</text>
      <text x="20" y="56" class="font-base" font-size="12" fill="#cbd5e1">悬停到目标文件夹上方时，文件夹整行瞬间呈现蓝光虚线框与</text>
      <text x="20" y="78" class="font-base" font-size="12" fill="#4ade80">「松开移入此处」高亮标签，松手即刻归类并自动展开文件夹。</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(0, 224)">
      <rect width="480" height="96" rx="8" fill="#251a30" stroke="#9333ea" stroke-width="1.2"/>
      <text x="20" y="30" class="font-base" font-size="14" font-weight="600" fill="#d8b4fe">3. 未分类释放槽与快速移出 (Uncategorized Dropzone)</text>
      <text x="20" y="56" class="font-base" font-size="12" fill="#cbd5e1">拖拽开始时自动显现未分类虚线释放槽，拖入松手立刻移出文件夹；</text>
      <text x="20" y="78" class="font-base" font-size="12" fill="#c084fc">亦可点击会话行右侧快捷移出按钮，双向操作随心所欲。</text>
    </g>
  </g>
</svg>
